name: sprax_mobile_wallet
description: "Non-custodial mobile wallet for SPRX blockchain on Android & iOS"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^9.0.0
  bip39: ^1.0.6
  ed25519_edwards: ^0.3.1
  pointycastle: ^3.7.3
  bech32: ^0.2.1
  crypto: ^3.0.3
  intl: ^0.19.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.1.0
  http: ^1.2.0
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

name: SPRX Protocol CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: Type Check & Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Cargo Check
        run: cargo check --all-targets --all-features

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run Workspace Tests
        run: cargo test --all-targets --all-features --verbose

  fmt:
    name: Code Formatting Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check Formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy Linter Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  backend-test:
    name: Python Backend Tests & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run Pytest
        working-directory: ./backend
        run: pytest

  frontend-build:
    name: Frontend Apps & SDK Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build Wallet Core SDK
        working-directory: ./packages/sprax-wallet-core
        run: |
          npm ci || npm install
          npm run build
      - name: Build Web Wallet
        working-directory: ./apps/web-wallet
        run: |
          npm ci || npm install
          npm run build
      - name: Build Explorer UI
        working-directory: ./apps/explorer-ui
        run: |
          npm ci || npm install
          npm run build
      - name: Build Admin Panel
        working-directory: ./apps/admin-panel
        run: |
          npm ci || npm install
          npm run build

  docker-build:
    name: Docker Stack Build Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Node Docker Image
        run: docker build -t sprax-node:ci -f docker/Dockerfile .
      - name: Build Backend Docker Image
        run: docker build -t sprax-backend:ci -f backend/Dockerfile backend/

  security:
    name: Security & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for Secrets
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified


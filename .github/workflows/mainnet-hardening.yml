name: Mainnet hardening verification

on:
  push:
    branches: ["codex/mainnet-hardening-*"]
  pull_request:
    paths: ["crates/**", "Cargo.toml", "Cargo.lock", "rust-toolchain.toml", ".github/workflows/mainnet-hardening.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mainnet-hardening-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Verify formatting
        run: cargo fmt --all -- --check
      - name: Run workspace regression and integration tests
        run: |
          cargo build --manifest-path contracts/examples/counter/Cargo.toml --target wasm32-unknown-unknown --release --locked
          export SPRX_TEST_CONTRACT_WASM="$GITHUB_WORKSPACE/contracts/examples/counter/target/wasm32-unknown-unknown/release/sprax_counter.wasm"
          cargo test --workspace --all-features --locked
      - name: Verify lint checks
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

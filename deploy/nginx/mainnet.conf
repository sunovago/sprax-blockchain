# SPRAX Mainnet — Nginx RPC Gateway + Load Balancer
worker_processes auto;
events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/json;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=rpc_limit:20m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=api_limit:20m rate=120r/m;
    limit_conn_zone $binary_remote_addr zone=conn_limit:20m;

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Referrer-Policy "no-referrer" always;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # Upstream: Public RPC (Sentry)
    upstream sprax_rpc {
        least_conn;
        server sentry-1:26657 weight=1 max_fails=3 fail_timeout=30s;
        server archive:26657  weight=1 max_fails=3 fail_timeout=30s backup;
        keepalive 64;
    }

    # Upstream: Backend REST + WebSocket API
    upstream sprax_api {
        least_conn;
        server api:8000 weight=1 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # HTTP redirect to HTTPS
    server {
        listen 80;
        server_name rpc.sprax.network api.sprax.network explorer.sprax.network;
        return 301 https://$host$request_uri;
    }

    # RPC Gateway: rpc.sprax.network
    server {
        listen 443 ssl http2;
        server_name rpc.sprax.network;

        ssl_certificate     /etc/letsencrypt/live/sprax.network/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/sprax.network/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        location / {
            limit_req zone=rpc_limit burst=20 nodelay;
            limit_conn conn_limit 20;

            proxy_pass http://sprax_rpc;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }
    }

    # API Gateway: api.sprax.network
    server {
        listen 443 ssl http2;
        server_name api.sprax.network;

        ssl_certificate     /etc/letsencrypt/live/sprax.network/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/sprax.network/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

        # CORS preflight
        add_header Access-Control-Allow-Origin "https://wallet.sprax.network https://explorer.sprax.network" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;

        location /ws/ {
            proxy_pass http://sprax_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400s;
        }

        location / {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://sprax_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }
    }
}
